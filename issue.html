<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue details | Hostel Issue Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="issue">

  <header class="site-header">
    <div class="inner">
      <a class="logo" href="index.html">Hostel Issue Tracker</a>
      <nav id="main-nav" aria-label="Main"></nav>
    </div>
  </header>

  <main id="page" hidden>
    <a class="back" id="back-link" href="index.html">Back to issues</a>
    <section id="issue-detail" aria-live="polite">
      <p class="note">Loading issue...</p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="api.js"></script>
  <script src="main.js"></script>
  <script>
    // Safety net: if a script file is missing or is an OLD copy, say so
    // instead of showing a blank page.
    window.addEventListener("load", function () {
      var ok = typeof api !== "undefined" && typeof api.login === "function" && typeof guard === "function";
      if (!ok) {
        document.body.innerHTML =
          '<main style="max-width:560px;margin:2rem auto;padding:0 1rem;font-family:sans-serif">' +
          '<h1>Setup problem</h1>' +
          '<p>api.js or main.js did not load, or one of them is an old copy.</p>' +
          '<p>Replace <b>every</b> file in the project folder with the newest versions, ' +
          'keep them all in the same folder, then hard refresh (Cmd + Shift + R).</p></main>';
      }
    });
  </script>
</body>
</html>
