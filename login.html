<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Hostel Issue Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">

  <header class="site-header">
    <div class="inner">
      <a class="logo" href="index.html">Hostel Issue Tracker</a>
      <nav id="main-nav" aria-label="Main"></nav>
    </div>
  </header>

  <main class="auth-page">
    <h1>Log in</h1>
    <p class="lead">Students and hostel administration both log in here. You will be taken to the right page.</p>

    <form id="login-form" class="form-card" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" autocomplete="username" inputmode="email">
        <p class="error-msg" id="err-email"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <p class="error-msg" id="err-password"></p>
      </div>

      <p class="error-msg" id="form-error"></p>
      <button type="submit" class="btn btn-primary">Log in</button>
      <p class="hint">New here? <a href="signup.html">Create an account</a></p>
    </form>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="api.js"></script>
  <script src="main.js"></script>
  <script>
    // Safety net: if a script file is missing or is an OLD copy, say so
    // instead of showing a blank page.
    window.addEventListener("load", function () {
      var ok = typeof api !== "undefined" && typeof api.login === "function" && typeof guard === "function";
      if (!ok) {
        document.body.innerHTML =
          '<main style="max-width:560px;margin:2rem auto;padding:0 1rem;font-family:sans-serif">' +
          '<h1>Setup problem</h1>' +
          '<p>api.js or main.js did not load, or one of them is an old copy.</p>' +
          '<p>Replace <b>every</b> file in the project folder with the newest versions, ' +
          'keep them all in the same folder, then hard refresh (Cmd + Shift + R).</p></main>';
      }
    });
  </script>
</body>
</html>
